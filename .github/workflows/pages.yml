# Publica a página do projeto (a pasta `site/`) no GitHub Pages.
#
# Só a pasta `site/` sai: o resto do repositório — docs, CLAUDE.md, código —
# não vira página. Roda quando algo em `site/` muda na main, ou à mão.
#
# Para funcionar: Settings → Pages → Source = "GitHub Actions". Em repositório
# PRIVADO o Pages exige plano pago; em público é grátis.
name: Página do projeto

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    # Enquanto o repositório for privado o Pages não existe (sem plano pago), e
    # o fluxo falharia a cada push. Público, ele roda sozinho.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
