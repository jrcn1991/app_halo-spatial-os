<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  A demo não fala com rede nenhuma: tudo o que ela mostra é deste diretório.
  Sem `connect-src` de fora, sem fonte de fora, sem script em linha.
-->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-src 'self'">
<title>Halo — demonstração</title>
<link rel="icon" href="../assets/icone.png">
<style>
  /*FONTES*/
  /* A página é só o "monitor": uma tela de 1680×1050 escalada para caber. */
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05070a; }
  body { font: 500 13px/1 "DM Sans", system-ui, sans-serif; color: #eef1f5; -webkit-font-smoothing: antialiased; }
  #tela {
    position: fixed; left: 0; top: 0; width: 1680px; height: 1050px;
    transform-origin: 0 0; overflow: hidden; background: #000;
  }
  .fundo { position: absolute; inset: 0; background: center / cover no-repeat; opacity: 0; transition: opacity 1.1s ease; }
  .fundo.ativo { opacity: 1; }
  iframe { position: absolute; border: 0; background: transparent; color-scheme: normal; }

  /* A barra do sistema, no topo, como a do Plasma. A ilha pousa sobre ela. */
  #barra {
    position: absolute; left: 0; right: 0; top: 0; height: 36px; z-index: 2;
    display: flex; align-items: center; gap: 6px; padding: 0 10px 0 14px;
    background: rgba(8, 10, 14, .62); backdrop-filter: blur(14px) saturate(1.2);
    border-bottom: 1px solid rgba(255, 255, 255, .06);
    font-size: 13px; color: rgba(238, 241, 245, .86);
  }
  #barra .marca { display: flex; align-items: center; gap: 8px; font-weight: 600; }
  #barra .marca img { width: 18px; height: 18px; }
  #barra .marca small { font: 500 11px "DM Mono", ui-monospace, monospace; color: rgba(238,241,245,.5); letter-spacing: .06em; text-transform: uppercase; margin-left: 4px; }
  #barra .vao { flex: 1; }
  #barra button {
    display: inline-flex; align-items: center; gap: 7px; height: 26px; padding: 0 9px;
    border: 0; border-radius: 7px; background: transparent; color: inherit; font: inherit; cursor: pointer;
    transition: background .15s;
  }
  #barra button:hover, #barra button[aria-pressed="true"] { background: rgba(255, 255, 255, .1); }
  #barra button svg { width: 16px; height: 16px; }
  #barra kbd { font: 500 10.5px "DM Mono", ui-monospace, monospace; padding: 2px 5px; border-radius: 4px; background: rgba(255,255,255,.1); color: rgba(238,241,245,.7); }
  #barra .relogio { font-variant-numeric: tabular-nums; padding: 0 6px 0 8px; }

  #app { left: 120px; top: 93px; width: 1440px; height: 900px; z-index: 1;
    transition: opacity .38s ease, transform .5s cubic-bezier(.2, .9, .3, 1); transform-origin: 50% 0; }
  /* Recolhida: a janela sobe para a ilha, como o Meta+Espaço faz no app. */
  #app.recolhida { opacity: 0; transform: translateY(-60px) scale(.9); pointer-events: none; }
  #avisos { left: 1228px; top: 44px; width: 440px; height: 560px; z-index: 3; pointer-events: none; }
  #ilha { left: 390px; top: 0; width: 900px; height: 440px; z-index: 4; pointer-events: none; }
  #lancador { left: 456px; top: 231px; width: 768px; height: 508px; z-index: 5;
    opacity: 0; transform: translateY(-10px) scale(.97); pointer-events: none; visibility: hidden;
    transition: opacity .22s ease, transform .26s cubic-bezier(.2, .9, .3, 1.2), visibility 0s .26s; }
  #lancador.visivel { opacity: 1; transform: none; pointer-events: auto; visibility: visible; transition-delay: 0s; }

  /* Enquanto o app carrega: uma pílula respirando no meio. */
  #carregando { position: absolute; inset: 0; z-index: 6; display: grid; place-items: center; pointer-events: none; transition: opacity .6s ease; }
  #carregando i { width: 180px; height: 36px; border-radius: 0 0 20px 20px; background: #000; box-shadow: 0 12px 34px rgba(0,0,0,.6); animation: respira 1.4s ease-in-out infinite alternate; }
  #carregando.pronto { opacity: 0; }
  @keyframes respira { to { width: 240px; } }
</style>
</head>
<body>
<div id="tela">
  <div class="fundo" id="fundo-a"></div>
  <div class="fundo" id="fundo-b"></div>

  <div id="barra">
    <span class="marca"><img src="../assets/icone.png" alt="">Halo<small id="nome-env">Floresta</small></span>
    <span class="vao"></span>
    <button type="button" id="b-lancador" data-t="Lançador|Launcher">
      <svg viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M229.66 218.34l-50.07-50.06a88.11 88.11 0 1 0-11.31 11.31l50.06 50.07a8 8 0 0 0 11.32-11.32ZM40 112a72 72 0 1 1 72 72 72.08 72.08 0 0 1-72-72Z"/></svg>
      <span class="rotulo">Lançador</span><kbd>Ctrl K</kbd>
    </button>
    <button type="button" id="b-aviso" data-t="Notificação de exemplo|Sample notification" title="Notificação de exemplo">
      <svg viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M221.8 175.94c-5.55-9.56-13.8-36.61-13.8-71.94a80 80 0 1 0-160 0c0 35.34-8.26 62.38-13.81 71.94A16 16 0 0 0 48 200h40.81a40 40 0 0 0 78.38 0H208a16 16 0 0 0 13.8-24.06ZM128 216a24 24 0 0 1-22.62-16h45.24A24 24 0 0 1 128 216Zm-80-32c7.7-13.24 16-43.92 16-80a64 64 0 1 1 128 0c0 36.05 8.28 66.73 16 80Z"/></svg>
    </button>
    <button type="button" id="b-halo" aria-pressed="true" data-t="Mostrar ou esconder o Halo|Show or hide Halo" title="Mostrar ou esconder o Halo">
      <img src="../assets/icone.png" alt="" width="16" height="16">
    </button>
    <span class="relogio" id="relogio"></span>
  </div>

  <iframe id="app" title="Halo" allowtransparency="true"></iframe>
  <iframe id="avisos" title="Notificações" allowtransparency="true"></iframe>
  <iframe id="ilha" title="Ilha" allowtransparency="true"></iframe>
  <iframe id="lancador" title="Lançador" allowtransparency="true"></iframe>
  <div id="carregando"><i></i></div>
</div>
<script src="desktop.js"></script>
</body>
</html>
