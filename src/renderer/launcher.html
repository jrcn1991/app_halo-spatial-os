<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!--
      CSP do lançador, separada da do app.
      Ele não mostra imagem de fora nem fala com rede: só o próprio bundle.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'"
    />
    <title>Halo · Lançador</title>
  </head>
  <body>
    <div id="lancador"></div>
    <script type="module" src="/launcher/main.tsx"></script>
  </body>
</html>
